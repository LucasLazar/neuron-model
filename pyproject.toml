[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "neuron-model"
version = "0.1.0"
description = "Dendritic LIF neuron with a split NMDA gate, buffered calcium and a Bayesian plasticity core: a first variant of Scheler's neuron-centric model"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
# the study scripts in physio/, branch/ and likelihood/, and make_ode_sheet.py
studies = ["matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/LucasLazar/neuron-model"

[tool.setuptools]
# Only the model is a package. Studies and tests run from the repository root.
packages = ["neuron"]

[tool.setuptools.package-data]
# The compiled kernel is built from kernel.c on first import (needs `cc`, or $CC).
neuron = ["kernel.c"]
